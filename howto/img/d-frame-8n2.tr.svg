<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 340" width="1152" height="340" role="img" aria-labelledby="d-frame-8n2-tr-t d-frame-8n2-tr-d" lang="tr">
<title id="d-frame-8n2-tr-t">8N2 frame'i</title>
<desc id="d-frame-8n2-tr-d">Bir karakterin frame'i, mantık seviyesi olarak soldan sağa: hat boşta 1'de, sonra start bit (0), sonra D0'dan D7'ye 8 data bit, sonra 2 stop bit (1), sonra yine boşta. Üstte parantezler: 1, 8 ve 2; hepsinin üstünde 11 bit = 1 karakter. Data hücrelerinin altında D0 önce gider (en düşük bit). Çizilen voltaj değil, mantık seviyesidir.</desc>
