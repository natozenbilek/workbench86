<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="d-sim-then-board-tr-t d-sim-then-board-tr-d" lang="tr">
<title id="d-sim-then-board-tr-t">Kart yokken ve kart varken</title>
<desc id="d-sim-then-board-tr-d">İki sütun. Solda, kart yokken: kartın girişlerini kullanmayan programlar simülatörde baştan sona çalışır, timer varsa hız Max. Kartın girişlerini kullanan programlar için üç adım: yaz, Assemble, Step, Back, sonra Download. Download'dan sağ sütuna bir ok: aynı .asm. Sağda, kart varken, yukarıdan aşağı: Device, PAT RESET, yeni PAT:, Upload and Run, sonucu kartta gör. En alttan sol sütuna dönen kırmızı bir ok: sorun çıkarsa simülatöre dön.</desc>
