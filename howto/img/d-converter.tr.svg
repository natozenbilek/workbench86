<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 360" width="1152" height="360" role="img" aria-labelledby="d-converter-tr-t d-converter-tr-d" lang="tr">
<title id="d-converter-tr-t">USB-RS232 çevirici</title>
<desc id="d-converter-tr-d">Uzun bir kutu: çevirici. Solunda USB fişi, sağında DE-9 fişi. İçinde soldan sağa USB-UART yongası (CH340, PL2303 ya da FTDI) ve seviye çevirici (MAX232 benzeri). Oklar: USB paketleri, mantık seviyesi, ±3 ile ±15 V. Üstte bir laptop: işletim sistemi + sürücü; laptoptan yongaya kesik mavi bir çizgi iner, yanında kırmızıyla: sürücü yoksa port görünmez. DE-9 çoğu yerde DB-9 diye geçer.</desc>
