<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="d-multi-org-en-t d-multi-org-en-d" lang="en">
<title id="d-multi-org-en-t">Several ORGs</title>
<desc id="d-multi-org-en-d">A memory ruler for segment 0080 from 0500 to 0700. At 0500 a blue block: pa29 main program, ORG 0500H. From its end to 0600 a hatched gap: not sent. At 0600 a second blue block: timer handler, ORG 0600H. Above, the page's lines: TX: C 0080:0500, 200 ms, TX: C 0080:0600, and last TX: G 0080:0500 with an arrow to the start of the first block. Below, a green arrow from the vector table at 0000:0094 to the second block: timer vector → 0080:0600. About 142 bytes in total. Not yet seen on a board.</desc>
