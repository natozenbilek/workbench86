.wbfig .f-text{fill:var(--text,#1a1a1a)}
.wbfig .f-text3{fill:var(--text3,#6b6b6b)}
.wbfig .s-bg2{stroke:var(--bg2,#ffffff)}
.wbfig .s-blu{stroke:var(--blu,#2471a3)}
.wbfig .s-brd{stroke:var(--brd,#d0d0c8)}
.wbfig .s-brd2{stroke:var(--brd2,#bbbbbb)}
.wbfig .s-grn{stroke:var(--grn,#1d7a45)}
.wbfig .s-red{stroke:var(--red,#c0392b)}
</style><pattern id="ehatch-tr" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" class="s-red" stroke-width="3"/></pattern></defs>
