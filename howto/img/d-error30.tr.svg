<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 440" width="1152" height="440" role="img" aria-labelledby="d-error30-tr-t d-error30-tr-d" lang="tr">
<title id="d-error30-tr-t">ERROR 30</title>
<desc id="d-error30-tr-d">İki panel. Solda, kod olmayan adres: segment 0080'in belleği; 0100'de yazılan kod (18 byte), 0500 ve 0800 boş ve kırmızı taralı. Mavi bir ok G 0080:0500'den 0500'e gidiyor: 1. G, kod yazılmamış bir adrese. Yeşil bir ok kesme vektöründen 0800'e gidiyor: 2. vektör, kod yüklenmemiş bir adrese. Altında ERROR 30 : Invalid Opcode Exception, === FAILED ... === ve Error B01. Sağda, doğru: kod 0500'de, TX: C 0080:0500 ve TX: G 0080:0500 aynı yeri gösteriyor; C ve G aynı adreste.</desc>
