<path class="s-text3" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M818.7,146.8 L814,138 L809.3,146.8"/>
<text class="tx f-text3" x="836" y="146" font-size="24" font-weight="700">On TTL, 1 is</text>
<text class="tx f-text3" x="836" y="176" font-size="24" font-weight="600">a high voltage</text>
<path class="s-text3" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M814,226 L814,260"/>
<path class="s-text3" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M809.3,251.2 L814,260 L818.7,251.2"/>
<text class="tx f-text3" x="836" y="236" font-size="24" font-weight="700">On RS-232, 1 is</text>
<text class="tx f-text3" x="836" y="266" font-size="24" font-weight="600">a negative voltage</text>
</svg>
