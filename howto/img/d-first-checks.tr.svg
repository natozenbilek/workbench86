<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 480" width="1152" height="480" role="img" aria-labelledby="d-first-checks-tr-t d-first-checks-tr-d" lang="tr">
<title id="d-first-checks-tr-t">Karta ilk bağlanışta dört kısa kontrol</title>
<desc id="d-first-checks-tr-d">Üstte ince kırmızı bir şerit: her kontrolden önce PAT RESET. Altında dört kart; her birinde ne yapılır ve beklenen. 1: hw-led-all-on.asm yüklenir, TX: C 0080:0100; LED'ler yanar, Program is running on the board. 2: aynı program ORG 0200H ile; beklenen TX: C 0080:0200 ve TX: G 0080:0200, sonra LED'ler yine yanar. 3, vurgulu: pa29; TX: C 0080:0500, TX: C 0080:0600, TX: G 0080:0500; hata kodu çıkmaz. 4: bağlıyken üç kez PAT RESET; her seferinde yeni [FF] PAT:; arada W01 çıkabilir, sorun değil. 2., 3. ve 4. kontrol henüz kartta denenmedi.</desc>
