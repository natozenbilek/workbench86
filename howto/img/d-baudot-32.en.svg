<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 672 400" width="672" height="400" role="img" aria-labelledby="d-baudot-32-en-t d-baudot-32-en-d" lang="en">
<title id="d-baudot-32-en-t">Five units, 32 symbols</title>
<desc id="d-baudot-32-en-d">Five squares in a row at the top, each one 0 or 1, with multiplication signs between them. Under them: 2 × 2 × 2 × 2 × 2 = 32. Further down, eight small squares and 2⁸ = 256: 8 data bits per character. At the bottom: five units give 32 symbols.</desc>
