<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 360" width="1152" height="360" role="img" aria-labelledby="d-frame-p-en-t d-frame-p-en-d" lang="en">
<title id="d-frame-p-en-t">The letter P on the line</title>
<desc id="d-frame-p-en-d">At the top: P = 0x50 = 0101 0000. An arrow runs from the right-hand 0000 down to the first data cell: starts from the right. Waveform: idle 1, start 0, data 0 0 0 0 1 0 1 0, two stop bits 1, idle 1. Under it a ruler from 0 to 1.146 ms; the first interval is 104 µs, the whole frame 11 × 104.2 µs = 1.146 ms. Bottom right: PAT: 4 characters = 4.58 ms; 8 of 11 bits are data: 72.7 %.</desc>
