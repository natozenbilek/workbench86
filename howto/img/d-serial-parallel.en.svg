<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 380" width="1152" height="380" role="img" aria-labelledby="d-serial-parallel-en-t d-serial-parallel-en-d" lang="en">
<title id="d-serial-parallel-en-t">Serial and parallel</title>
<desc id="d-serial-parallel-en-d">Two panels. On the left, serial: one purple wire between the sender and the receiver, carrying eight bits one after another, 0 0 0 0 1 0 1 0, with a time arrow under it. On the right, parallel: eight wires between the same two boxes, one bit on each, all in one column. The seventh bit lags behind the others, outlined in red and marked "late bit".</desc>
