<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 672 400" width="672" height="400" role="img" aria-labelledby="d-rs232-1960-en-t d-rs232-1960-en-d" lang="en">
<title id="d-rs232-1960-en-t">The road of RS-232</title>
<desc id="d-rs232-1960-en-d">A timeline from left to right. 1960: RS-232, published by the EIA. 1969: RS-232-C, the long-lived version. Today: four boxes, machine tools, lab instruments, server consoles and the DIGIAC 2000.</desc>
<defs><style>
