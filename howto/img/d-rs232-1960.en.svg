<text class="tx f-text3" x="110" y="170" font-size="22" font-weight="600" text-anchor="middle">by the EIA</text>
<circle class="f-pur-l s-pur" cx="320" cy="96" r="10" stroke-width="3"/>
<text class="tm f-pur" x="320" y="70" font-size="28" font-weight="700" text-anchor="middle">1969</text>
<text class="tx f-text" x="320" y="142" font-size="24" font-weight="700" text-anchor="middle">RS-232-C</text>
<text class="tx f-text3" x="320" y="170" font-size="22" font-weight="600" text-anchor="middle">the long-lived one</text>
