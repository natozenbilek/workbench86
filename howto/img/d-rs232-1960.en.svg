<text class="tx f-text" x="184" y="261" font-size="24" font-weight="700" text-anchor="middle">machine tools</text>
<rect class="f-pur-l s-pur" x="344" y="222" width="288" height="60" rx="8" stroke-width="3"/>
<text class="tx f-text" x="488" y="261" font-size="24" font-weight="700" text-anchor="middle">lab instruments</text>
