<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="d-seg-offset-en-t d-seg-offset-en-d" lang="en">
<title id="d-seg-offset-en-t">Segment and offset</title>
<desc id="d-seg-offset-en-d">At the top 0080 : 0100. 0080 in a green box: segment (the board's). 0100 in a blue box: offset (your ORG). Under it a column sum: 0080 × 10h = 00800 (one hex digit left), + 0100, = 00900, 2304 in decimal. On the right a table: 0080:0100 → 00900 most programs; 0080:0200 → 00A00 the ORG 0200H check; 0080:0500 → 00D00 pa29 main program; 0080:0600 → 00E00 pa29 timer handler.</desc>
<defs><style>
.wbfig .tx{font-family:'Atkinson Hyperlegible Next','Source Sans 3','Segoe UI',Arial,sans-serif}
.wbfig .tm{font-family:'JetBrains Mono','IBM Plex Mono',Consolas,Menlo,monospace;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.wbfig .f-bg2{fill:var(--bg2,#ffffff)}
.wbfig .f-bg3{fill:var(--bg3,#eeeeea)}
.wbfig .f-blu{fill:var(--blu,#2471a3)}
.wbfig .f-blu-l{fill:var(--blu-l,rgba(36,113,163,.08))}
.wbfig .f-grn{fill:var(--grn,#1d7a45)}
.wbfig .f-grn-l{fill:var(--grn-l,rgba(39,174,96,.08))}
.wbfig .f-text{fill:var(--text,#1a1a1a)}
.wbfig .f-text3{fill:var(--text3,#6b6b6b)}
.wbfig .s-blu{stroke:var(--blu,#2471a3)}
.wbfig .s-brd{stroke:var(--brd,#d0d0c8)}
.wbfig .s-brd2{stroke:var(--brd2,#bbbbbb)}
.wbfig .s-grn{stroke:var(--grn,#1d7a45)}
.wbfig .s-text{stroke:var(--text,#1a1a1a)}
.wbfig .s-text3{stroke:var(--text3,#6b6b6b)}
</style></defs>
<rect class="wb-panel f-bg2 s-brd" x="1" y="1" width="1150" height="418" rx="14" stroke-width="2"/>
<rect class="f-grn-l s-grn" x="70" y="20" width="170" height="74" rx="8" stroke-width="3"/>
<text class="tm f-grn" x="155" y="76" font-size="52" font-weight="700" text-anchor="middle">0080</text>
<text class="tm f-text" x="274" y="76" font-size="52" font-weight="700" text-anchor="middle">:</text>
<rect class="f-blu-l s-blu" x="308" y="20" width="170" height="74" rx="8" stroke-width="3"/>
<text class="tm f-blu" x="393" y="76" font-size="52" font-weight="700" text-anchor="middle">0100</text>
<text class="tx f-grn" x="155" y="124" font-size="24" font-weight="700" text-anchor="middle">segment (the board's)</text>
<text class="tx f-blu" x="393" y="124" font-size="24" font-weight="700" text-anchor="middle">offset (your ORG)</text>
<text class="tx f-text3" x="490" y="164" font-size="22" font-weight="600" text-anchor="end">one hex digit left</text>
<path class="s-text3" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M450,170 L480.4,180"/>
<path class="s-text3" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M472.5,181.4 L480.4,180 L474.9,174.2"/>
<text class="tm f-grn" x="470.8" y="212" font-size="32" font-weight="700" text-anchor="end">0080 × 10h = 0080</text>
<text class="tm f-text3" x="490" y="212" font-size="32" font-weight="700" text-anchor="end">0</text>
<text class="tm f-blu" x="490" y="256" font-size="32" font-weight="700" text-anchor="end">+ 0100</text>
<path class="s-text" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M368.8,274 L494,274"/>
<rect class="s-text" x="306" y="292" width="198" height="62" rx="6" fill="none" stroke-width="5"/>
<text class="tm f-text" x="490" y="337" font-size="40" font-weight="700" text-anchor="end">= 00900</text>
<text class="tm f-text3" x="290" y="332" font-size="26" font-weight="700" text-anchor="end">2304</text>
<text class="tx f-text3" x="290" y="360" font-size="22" font-weight="600" text-anchor="end">(decimal)</text>
<rect class="f-bg3 s-brd2" x="600" y="30" width="536" height="330" rx="8" stroke-width="2"/>
<text class="tx f-text3" x="616" y="70" font-size="24" font-weight="700">address</text>
<text class="tx f-text3" x="796" y="70" font-size="24" font-weight="700">physical</text>
<text class="tx f-text3" x="922" y="70" font-size="24" font-weight="700">used by</text>
<path class="s-brd2" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M610,86 L1126,86"/>
<rect class="f-grn-l" x="608" y="100" width="520" height="50" rx="4"/>
<text class="tm f-grn" x="616" y="134" font-size="24" font-weight="700"><tspan class="f-grn">0080:</tspan><tspan class="f-blu">0100</tspan></text>
<text class="tm f-text3" x="768" y="134" font-size="24" font-weight="700" text-anchor="middle">→</text>
<text class="tm f-text" x="796" y="134" font-size="24" font-weight="700">00900</text>
<text class="tx f-text" x="922" y="134" font-size="22" font-weight="600">most programs</text>
<text class="tm f-grn" x="616" y="192" font-size="24" font-weight="700"><tspan class="f-grn">0080:</tspan><tspan class="f-blu">0200</tspan></text>
<text class="tm f-text3" x="768" y="192" font-size="24" font-weight="700" text-anchor="middle">→</text>
<text class="tm f-text" x="796" y="192" font-size="24" font-weight="700">00A00</text>
<text class="tx f-text" x="922" y="192" font-size="22" font-weight="600">ORG 0200H</text>
<text class="tm f-grn" x="616" y="250" font-size="24" font-weight="700"><tspan class="f-grn">0080:</tspan><tspan class="f-blu">0500</tspan></text>
<text class="tm f-text3" x="768" y="250" font-size="24" font-weight="700" text-anchor="middle">→</text>
<text class="tm f-text" x="796" y="250" font-size="24" font-weight="700">00D00</text>
<text class="tx f-text" x="922" y="250" font-size="22" font-weight="600">pa29 main program</text>
<text class="tm f-grn" x="616" y="308" font-size="24" font-weight="700"><tspan class="f-grn">0080:</tspan><tspan class="f-blu">0600</tspan></text>
<text class="tm f-text3" x="768" y="308" font-size="24" font-weight="700" text-anchor="middle">→</text>
<text class="tm f-text" x="796" y="308" font-size="24" font-weight="700">00E00</text>
<text class="tx f-text" x="922" y="308" font-size="22" font-weight="600">pa29 timer handler</text>
</svg>
