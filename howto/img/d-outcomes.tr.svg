<text class="tm f-text" x="410" y="78" font-size="22" font-weight="600">=== SUCCESS ===</text>
<text class="tx f-text3" x="410" y="111" font-size="22" font-weight="600">EXIT ile biten program (INT 28H, AH=4), ör. pa02</text>
