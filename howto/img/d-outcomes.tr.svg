<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 440" width="1152" height="440" role="img" aria-labelledby="d-outcomes-tr-t d-outcomes-tr-d" lang="tr">
<title id="d-outcomes-tr-t">G komutu ve üç sonuç</title>
<desc id="d-outcomes-tr-d">Solda TX: G 0080:0100. Ondan 8 saniyelik sarı bir bekleme çubuğu ve üç ok çıkıyor. Birinci kart, yeşil: 8 s içinde PAT: gelirse === SUCCESS ===; EXIT ile biten programlar, örneğin pa02. İkinci kart, mavi ve vurgulu: 8 s içinde ses yoksa --- Program is running on the board. Press PAT RESET before the next upload.; döngüyle biten programlar, örneğin hw-led-all-on, etiket BOARD RUNNING. Üçüncü kart, kırmızı: ERROR satırı gelirse === FAILED: the board reported ERROR 30 : Invalid Opcode Exception === ve Error B01.</desc>
<defs><style>
.wbfig .tx{font-family:'Atkinson Hyperlegible Next','Source Sans 3','Segoe UI',Arial,sans-serif}
.wbfig .tm{font-family:'JetBrains Mono','IBM Plex Mono',Consolas,Menlo,monospace;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.wbfig .f-amb{fill:var(--amb,#7d6608)}
.wbfig .f-amb-l{fill:var(--amb-l,rgba(183,149,11,.08))}
.wbfig .f-bg2{fill:var(--bg2,#ffffff)}
.wbfig .f-blu{fill:var(--blu,#2471a3)}
.wbfig .f-blu-l{fill:var(--blu-l,rgba(36,113,163,.08))}
.wbfig .f-grn{fill:var(--grn,#1d7a45)}
.wbfig .f-grn-l{fill:var(--grn-l,rgba(39,174,96,.08))}
.wbfig .f-red{fill:var(--red,#c0392b)}
.wbfig .f-red-l{fill:var(--red-l,rgba(192,57,43,.08))}
.wbfig .f-text{fill:var(--text,#1a1a1a)}
.wbfig .f-text3{fill:var(--text3,#6b6b6b)}
.wbfig .s-amb{stroke:var(--amb,#7d6608)}
.wbfig .s-blu{stroke:var(--blu,#2471a3)}
.wbfig .s-brd{stroke:var(--brd,#d0d0c8)}
.wbfig .s-grn{stroke:var(--grn,#1d7a45)}
.wbfig .s-red{stroke:var(--red,#c0392b)}
</style></defs>
