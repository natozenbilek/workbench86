<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 420" width="1152" height="420" role="img" aria-labelledby="d-big-picture-tr-t d-big-picture-tr-d" lang="tr" data-focus="agenda">
<title id="d-big-picture-tr-t">Sayfadan karta giden yol</title>
<desc id="d-big-picture-tr-d">Soldan sağa üç kutu. Solda tarayıcı: içinde Editör, Simülatör ve Terminal, altında WebSerial şeridi. Ortada USB-RS232 çevirici; tarayıcıya USB ile bağlı, altında "sürücü gerekir" yazıyor. Sağda DIGIAC 2000 kartı: ROM'daki monitor programı PAT: yazıyor, altında 80286 ve RAM, sekiz LED ve kırmızı PAT RESET düğmesi. Çevirici ile kart arasında RS-232 kablosu, üzerinde 9600 8N2. Üstte iki ok: Terminal'den karta "C, byte'lar, G", karttan Terminal'e "PAT:, cevaplar".</desc>
<defs><style>
.wbfig .tx{font-family:'Atkinson Hyperlegible Next','Source Sans 3','Segoe UI',Arial,sans-serif}
.wbfig .tm{font-family:'JetBrains Mono','IBM Plex Mono',Consolas,Menlo,monospace;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.wbfig .f-acc{fill:var(--acc,#c0392b)}
.wbfig .f-amb-l{fill:var(--amb-l,rgba(183,149,11,.08))}
.wbfig .f-bg2{fill:var(--bg2,#ffffff)}
.wbfig .f-blu{fill:var(--blu,#2471a3)}
.wbfig .f-blu-l{fill:var(--blu-l,rgba(36,113,163,.08))}
.wbfig .f-cyn{fill:var(--cyn,#117864)}
.wbfig .f-cyn-l{fill:var(--cyn-l,rgba(23,165,137,.08))}
.wbfig .f-grn{fill:var(--grn,#1d7a45)}
.wbfig .f-grn-l{fill:var(--grn-l,rgba(39,174,96,.08))}
.wbfig .f-pur{fill:var(--pur,#8e44ad)}
.wbfig .f-text{fill:var(--text,#1a1a1a)}
.wbfig .f-text3{fill:var(--text3,#6b6b6b)}
.wbfig .s-amb{stroke:var(--amb,#7d6608)}
.wbfig .s-bg2{stroke:var(--bg2,#ffffff)}
.wbfig .s-blu{stroke:var(--blu,#2471a3)}
.wbfig .s-brd{stroke:var(--brd,#d0d0c8)}
.wbfig .s-cyn{stroke:var(--cyn,#117864)}
.wbfig .s-grn{stroke:var(--grn,#1d7a45)}
.wbfig .s-pur{stroke:var(--pur,#8e44ad)}
.wbfig .s-text{stroke:var(--text,#1a1a1a)}
.wbfig .num,.wbfig .chk,.wbfig .lock{display:none}
.wbfig .part{transition:opacity .2s}
svg[data-focus="agenda"] .num,svg[data-focus="done"] .chk,svg[data-focus="board"] .lock{display:inline}
svg[data-focus="line"] .part:not(.fx-line){opacity:.4}
svg[data-focus="line"] .fx-line .fs{stroke-width:5}
svg[data-focus="sim"] .part:not(.fx-sim){opacity:.4}
svg[data-focus="sim"] .fx-sim .fs{stroke-width:5}
svg[data-focus="upload"] .part:not(.fx-upload){opacity:.4}
svg[data-focus="upload"] .fx-upload .fs{stroke-width:5}
svg[data-focus="board"] .part:not(.fx-board){opacity:.4}
svg[data-focus="board"] .fx-board .fs{stroke-width:5}
.wbfig .bp-st:target~.num{display:none}
#bp-agenda:target~.num,#bp-done:target~.chk,#bp-board:target~.lock{display:inline}
#bp-line:target~.part:not(.fx-line){opacity:.4}
#bp-line:target~.fx-line .fs{stroke-width:5}
#bp-sim:target~.part:not(.fx-sim){opacity:.4}
#bp-sim:target~.fx-sim .fs{stroke-width:5}
#bp-upload:target~.part:not(.fx-upload){opacity:.4}
#bp-upload:target~.fx-upload .fs{stroke-width:5}
#bp-board:target~.part:not(.fx-board){opacity:.4}
#bp-board:target~.fx-board .fs{stroke-width:5}
</style></defs>
