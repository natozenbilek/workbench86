<text class="tx f-amb" x="952.8" y="150" font-size="22" font-weight="700" text-anchor="end">8 s içinde PAT:</text>
<text class="tx f-amb" x="952.8" y="176" font-size="22" font-weight="700" text-anchor="end">gelmezse burada kalır</text>
<text class="tm f-acc" x="1136" y="256" font-size="22" font-weight="700" text-anchor="end">PAT: geldi</text>
<text class="tm f-acc" x="1136" y="282" font-size="22" font-weight="700" text-anchor="end">(program döndü ya da PAT RESET)</text>
