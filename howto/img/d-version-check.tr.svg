<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 360" width="1152" height="360" role="img" aria-labelledby="d-version-check-tr-t d-version-check-tr-d" lang="tr">
<title id="d-version-check-tr-t">Yeni sürümün işareti</title>
<desc id="d-version-check-tr-d">Yan yana iki terminal. Solda v18, yeşil onay işaretiyle: TX: C 0080:0500 ve TX: G 0080:0500; 0080: kısımları yeşil, 0500 kısımları mavi. Altında: henüz kartta denenmedi. Sağda, kırmızı çarpıyla, eski, önbellekte kalmış sürüm: C 0500 (0080: yok) ve C 0100 (ORG ne olursa olsun), ikisinin de üstü çizili. Altta ortada Copy kaydının ilk satırı: workbench86 v18 | ...</desc>
<defs><style>
.wbfig .tx{font-family:'Atkinson Hyperlegible Next','Source Sans 3','Segoe UI',Arial,sans-serif}
.wbfig .tm{font-family:'JetBrains Mono','IBM Plex Mono',Consolas,Menlo,monospace;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.wbfig .f-amb{fill:var(--amb,#7d6608)}
.wbfig .f-amb-l{fill:var(--amb-l,rgba(183,149,11,.08))}
.wbfig .f-bg2{fill:var(--bg2,#ffffff)}
.wbfig .f-bg3{fill:var(--bg3,#eeeeea)}
.wbfig .f-blu{fill:var(--blu,#2471a3)}
.wbfig .f-grn{fill:var(--grn,#1d7a45)}
.wbfig .f-red{fill:var(--red,#c0392b)}
.wbfig .f-text{fill:var(--text,#1a1a1a)}
.wbfig .f-text3{fill:var(--text3,#6b6b6b)}
.wbfig .s-amb{stroke:var(--amb,#7d6608)}
.wbfig .s-bg2{stroke:var(--bg2,#ffffff)}
.wbfig .s-brd{stroke:var(--brd,#d0d0c8)}
.wbfig .s-grn{stroke:var(--grn,#1d7a45)}
.wbfig .s-red{stroke:var(--red,#c0392b)}
</style></defs>
<rect class="wb-panel f-bg2 s-brd" x="1" y="1" width="1150" height="358" rx="14" stroke-width="2"/>
<rect class="f-bg3 s-grn" x="20" y="20" width="540" height="240" rx="8" stroke-width="5"/>
<circle class="f-grn" cx="52" cy="56" r="16"/>
<path class="s-bg2" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M44,56 l6,7 l11,-13"/>
<text class="tm f-grn" x="78" y="66" font-size="28" font-weight="700">v18</text>
<text class="tm f-text" x="44" y="124" font-size="26" font-weight="700" xml:space="preserve"><tspan class="f-text">TX: C </tspan><tspan class="f-grn">0080:</tspan><tspan class="f-blu">0500</tspan></text>
<text class="tm f-text" x="44" y="170" font-size="26" font-weight="700" xml:space="preserve"><tspan class="f-text">TX: G </tspan><tspan class="f-grn">0080:</tspan><tspan class="f-blu">0500</tspan></text>
<rect class="f-amb-l s-amb" x="44" y="206" width="277.1" height="34" rx="17" stroke-width="2"/>
<text class="tx f-amb" x="182.5" y="230" font-size="22" font-weight="700" text-anchor="middle">henüz kartta denenmedi</text>
<rect class="f-bg3 s-red" x="592" y="20" width="540" height="240" rx="8" stroke-width="3"/>
<circle class="f-red" cx="624" cy="56" r="16"/>
<path class="s-bg2" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M617,49 l14,14 M631,49 l-14,14"/>
<text class="tx f-red" x="650" y="66" font-size="26" font-weight="700">eski, önbellekte kalmış sürüm</text>
