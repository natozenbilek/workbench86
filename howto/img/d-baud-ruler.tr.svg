<rect class="f-pur-l s-pur" x="50" y="108" width="56.2" height="64" rx="3" stroke-width="5"/>
<text class="tm f-pur" x="50" y="86" font-size="26" font-weight="700">1 bit yaklaşık 104 µs</text>
