<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 672 400" width="672" height="400" role="img" aria-labelledby="d-baud-ruler-tr-t d-baud-ruler-tr-d" lang="tr">
<title id="d-baud-ruler-tr-t">9600 baud'da bir bit</title>
<desc id="d-baud-ruler-tr-d">0'dan 1 milisaniyeye bir zaman cetveli. Her 104 mikrosaniyede bir mor çentik var, 1'den 9'a numaralı; 1 ms, 9. ile 10. çentiğin arasına düşüyor: 9,6 bit. İlk aralığın üstünde tek bir bit kutusu: 1 bit yaklaşık 104 µs. Altta: 1 s = 9600 bit; RS-232'de 1 sembol = 1 bit.</desc>
<defs><style>
.wbfig .tx{font-family:'Atkinson Hyperlegible Next','Source Sans 3','Segoe UI',Arial,sans-serif}
.wbfig .tm{font-family:'JetBrains Mono','IBM Plex Mono',Consolas,Menlo,monospace;font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.wbfig .f-bg2{fill:var(--bg2,#ffffff)}
.wbfig .f-pur{fill:var(--pur,#8e44ad)}
.wbfig .f-pur-l{fill:var(--pur-l,rgba(142,68,173,.08))}
.wbfig .f-text{fill:var(--text,#1a1a1a)}
.wbfig .f-text3{fill:var(--text3,#6b6b6b)}
.wbfig .s-brd{stroke:var(--brd,#d0d0c8)}
.wbfig .s-pur{stroke:var(--pur,#8e44ad)}
.wbfig .s-text{stroke:var(--text,#1a1a1a)}
</style></defs>
