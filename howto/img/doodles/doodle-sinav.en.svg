<svg xmlns="http://www.w3.org/2000/svg" class="doodle" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="doodle-sinav-en-t doodle-sinav-en-d" lang="en">
<title id="doodle-sinav-en-t">The exam starts: the start bit</title>
<desc id="doodle-sinav-en-d">A simple hand-drawn picture. On the left a proctor in a yellow T-shirt raises one hand, and the bubble says &quot;You may begin.&quot;. A label &quot;start bit&quot; points to the raised hand. On the right a student in a blue T-shirt sits at a desk, raises one arm and looks at the watch on the wrist; a label &quot;own watch&quot; points to the watch.</desc>
