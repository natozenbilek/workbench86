<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 500" width="1152" height="500" role="img" aria-labelledby="d-upload-seq-tr-t d-upload-seq-tr-d" lang="tr">
<title id="d-upload-seq-tr-t">Yüklemenin adımları</title>
<desc id="d-upload-seq-tr-d">Sıra diyagramı. Solda workbench86 (sayfa), sağda kartın ROM monitor programı. Beş adım: 1. sayfa CR LF gönderir, kart 2 s içinde PAT: ile cevap vermezse U01. 2. C 0080:0100, kart adresi geri yazar, 3 s, gelmezse U02. 3. her byte için, 18 kez, B0 gibi iki hex rakam; kart : ile cevap verir, 2 s, gelmezse [!] ve sonda W02. 4. ESC CR (1B 0D), kart PAT: yazar; 3 s içinde gelmezse sayfa bir boş satır gönderip 2 s daha bekler, yine gelmezse U03. 5. G 0080:0100; 8 s içinde PAT:, ERROR ya da sessizlik: üç sonuç. Sağda kırmızı bir çubuk 2. ile 4. adımı kapsıyor: U04, kart araya PAT:, ERROR ya da [FF] yazarsa durur, G gönderilmez.</desc>
<defs><style>
