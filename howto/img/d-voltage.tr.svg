<svg xmlns="http://www.w3.org/2000/svg" class="wbfig" viewBox="0 0 1152 400" width="1152" height="400" role="img" aria-labelledby="d-voltage-tr-t d-voltage-tr-d" lang="tr">
<title id="d-voltage-tr-t">RS-232 voltajları</title>
<desc id="d-voltage-tr-d">Solda -15 V ile +15 V arası dikey bir voltaj ekseni. +3 ile +15 V arası mor bant: 0 (space). -3 ile +3 V arası taralı sarı bant: geçersiz. -15 ile -3 V arası mor bant: 1 (mark). Üzerinde örnek bir sinyal: boşta -10 V civarında (boşta = 1), start bit +10 V civarında (start = 0). Sağda karşılaştırma: TTL'de 1 yüksek voltaj, RS-232'de 1 eksi voltaj.</desc>
