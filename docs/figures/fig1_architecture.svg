<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Helvetica,Arial,sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
    <linearGradient id="cpu-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="1" stop-color="#ffe9b0"/>
    </linearGradient>
    <linearGradient id="io-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f5ec"/>
      <stop offset="1" stop-color="#cce8d6"/>
    </linearGradient>
    <linearGradient id="ui-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#d5e1f6"/>
    </linearGradient>
    <linearGradient id="hw-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde9e6"/>
      <stop offset="1" stop-color="#f9c7c0"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="440" y="26" text-anchor="middle" font-weight="700" font-size="16">workbench86 — System Architecture</text>

  <!-- Browser container -->
  <rect x="20" y="50" width="700" height="450" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/>
  <text x="40" y="72" font-style="italic" fill="#555">Browser (single-page app)</text>

  <!-- Frontend: Editor -->
  <rect x="40"  y="90" width="200" height="60" rx="6" fill="url(#ui-grad)" stroke="#3b6abf"/>
  <text x="140" y="115" text-anchor="middle" font-weight="700">Editor + Tabs</text>
  <text x="140" y="135" text-anchor="middle" font-size="11">syntax highlighting, tooltips</text>

  <rect x="260" y="90" width="200" height="60" rx="6" fill="url(#ui-grad)" stroke="#3b6abf"/>
  <text x="360" y="115" text-anchor="middle" font-weight="700">File Explorer</text>
  <text x="360" y="135" text-anchor="middle" font-size="11">50 examples + local files</text>

  <rect x="480" y="90" width="220" height="60" rx="6" fill="url(#ui-grad)" stroke="#3b6abf"/>
  <text x="590" y="115" text-anchor="middle" font-weight="700">Debugger Panel</text>
  <text x="590" y="135" text-anchor="middle" font-size="11">regs · mem · trace · I/O log</text>

  <!-- Assembler pipeline -->
  <rect x="40" y="180" width="200" height="60" rx="6" fill="#fff" stroke="#999"/>
  <text x="140" y="205" text-anchor="middle" font-weight="700">Parser</text>
  <text x="140" y="225" text-anchor="middle" font-size="11">labels · expr · DB/DW</text>

  <rect x="260" y="180" width="200" height="60" rx="6" fill="#fff" stroke="#999"/>
  <text x="360" y="205" text-anchor="middle" font-weight="700">Encoder</text>
  <text x="360" y="225" text-anchor="middle" font-size="11">opcodes · ModR/M · prefixes</text>

  <rect x="480" y="180" width="220" height="60" rx="6" fill="#fff" stroke="#999"/>
  <text x="590" y="205" text-anchor="middle" font-weight="700">HLL Transpiler</text>
  <text x="590" y="225" text-anchor="middle" font-size="11">C / Py / Go / Java → ASM</text>

  <!-- CPU Core -->
  <rect x="40" y="270" width="660" height="80" rx="8" fill="url(#cpu-grad)" stroke="#c08020" stroke-width="1.5"/>
  <text x="370" y="298" text-anchor="middle" font-weight="700">CPU Core (real-mode 8086 subset)</text>
  <text x="370" y="320" text-anchor="middle" font-size="11">fetch → prefix consume → opcode dispatch → ALU/string/branch → flag update</text>
  <text x="370" y="338" text-anchor="middle" font-size="11">76 mnemonics · 156 opcode forms · 8 ALU ops · 16 Jcc · REP/REPE/REPNE · interrupts</text>

  <!-- Memory / IO / IRQ -->
  <rect x="40" y="380" width="200" height="60" rx="6" fill="#fff" stroke="#666"/>
  <text x="140" y="405" text-anchor="middle" font-weight="700">1 MB Memory</text>
  <text x="140" y="425" text-anchor="middle" font-size="11">20-bit segment:offset</text>

  <rect x="260" y="380" width="200" height="60" rx="6" fill="url(#io-grad)" stroke="#3a8b53"/>
  <text x="360" y="405" text-anchor="middle" font-weight="700">256-Port I/O</text>
  <text x="360" y="425" text-anchor="middle" font-size="11">MUART 8256 @ 0x80–0x9E</text>

  <rect x="480" y="380" width="220" height="60" rx="6" fill="#fff" stroke="#666"/>
  <text x="590" y="405" text-anchor="middle" font-weight="700">Interrupt Controller</text>
  <text x="590" y="425" text-anchor="middle" font-size="11">IF · IRR · INT 25H / 28H</text>

  <!-- Peripherals row -->
  <rect x="40"  y="470" width="120" height="22" rx="4" fill="url(#io-grad)" stroke="#3a8b53"/>
  <text x="100" y="485" text-anchor="middle" font-size="11">LED bars</text>
  <rect x="170" y="470" width="120" height="22" rx="4" fill="url(#io-grad)" stroke="#3a8b53"/>
  <text x="230" y="485" text-anchor="middle" font-size="11">DC motor + encoder</text>
  <rect x="300" y="470" width="120" height="22" rx="4" fill="url(#io-grad)" stroke="#3a8b53"/>
  <text x="360" y="485" text-anchor="middle" font-size="11">Pot / ADC / DAC</text>
  <rect x="430" y="470" width="120" height="22" rx="4" fill="url(#io-grad)" stroke="#3a8b53"/>
  <text x="490" y="485" text-anchor="middle" font-size="11">Piezo · ultrasonic</text>
  <rect x="560" y="470" width="140" height="22" rx="4" fill="url(#io-grad)" stroke="#3a8b53"/>
  <text x="630" y="485" text-anchor="middle" font-size="11">Timer · keyboard FIFO</text>

  <!-- Hardware bridge (right side) -->
  <rect x="740" y="280" width="120" height="60" rx="6" fill="url(#hw-grad)" stroke="#c04040"/>
  <text x="800" y="305" text-anchor="middle" font-weight="700">Serial Bridge</text>
  <text x="800" y="325" text-anchor="middle" font-size="11">WebSerial 9600 8N2</text>

  <rect x="740" y="380" width="120" height="80" rx="6" fill="url(#hw-grad)" stroke="#c04040"/>
  <text x="800" y="408" text-anchor="middle" font-weight="700">Physical</text>
  <text x="800" y="424" text-anchor="middle" font-weight="700">PAT-286</text>
  <text x="800" y="440" text-anchor="middle" font-size="11">trainer board</text>

  <!-- Arrows -->
  <line x1="140" y1="150" x2="140" y2="178" stroke="#333" marker-end="url(#arr)"/>
  <line x1="240" y1="210" x2="258" y2="210" stroke="#333" marker-end="url(#arr)"/>
  <line x1="590" y1="240" x2="590" y2="268" stroke="#333" marker-end="url(#arr)"/>
  <line x1="360" y1="240" x2="360" y2="268" stroke="#333" marker-end="url(#arr)"/>
  <line x1="140" y1="240" x2="140" y2="268" stroke="#333" marker-end="url(#arr)"/>

  <line x1="140" y1="350" x2="140" y2="378" stroke="#333" marker-end="url(#arr)"/>
  <line x1="360" y1="350" x2="360" y2="378" stroke="#333" marker-end="url(#arr)"/>
  <line x1="590" y1="350" x2="590" y2="378" stroke="#333" marker-end="url(#arr)"/>

  <line x1="700" y1="410" x2="738" y2="410" stroke="#333" marker-end="url(#arr)"/>
  <line x1="800" y1="340" x2="800" y2="378" stroke="#c04040" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <line x1="700" y1="310" x2="738" y2="310" stroke="#c04040" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <!-- Side arrow CPU → debugger panel -->
  <line x1="590" y1="270" x2="590" y2="152" stroke="#333" stroke-dasharray="2 3" marker-end="url(#arr)"/>

  <!-- Legend -->
  <g transform="translate(20,510)">
    <rect width="14" height="14" fill="url(#ui-grad)" stroke="#3b6abf"/>
    <text x="20" y="12" font-size="11">UI</text>
    <rect width="14" height="14" x="60" fill="url(#cpu-grad)" stroke="#c08020"/>
    <text x="80" y="12" font-size="11">CPU</text>
    <rect width="14" height="14" x="120" fill="url(#io-grad)" stroke="#3a8b53"/>
    <text x="140" y="12" font-size="11">I/O</text>
    <rect width="14" height="14" x="180" fill="url(#hw-grad)" stroke="#c04040"/>
    <text x="200" y="12" font-size="11">Hardware</text>
    <line x1="280" y1="7" x2="320" y2="7" stroke="#333"/>
    <text x="324" y="12" font-size="11">data flow</text>
    <line x1="400" y1="7" x2="440" y2="7" stroke="#c04040" stroke-dasharray="5 3"/>
    <text x="444" y="12" font-size="11">over USB serial</text>
  </g>
</svg>
