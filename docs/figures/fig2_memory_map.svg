<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Helvetica,Arial,sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-weight="700" font-size="16">PAT-286 Memory and I/O Layout</text>

  <!-- Memory column -->
  <text x="170" y="58" text-anchor="middle" font-weight="700" font-size="14">1 MB Physical Memory</text>

  <rect x="50" y="70" width="240" height="32" fill="#fde9e6" stroke="#c04040"/>
  <text x="170" y="91" text-anchor="middle">IVT (Interrupt Vector Table)</text>
  <text x="295" y="91" text-anchor="start" font-size="11">00000H</text>
  <text x="45"  y="91" text-anchor="end"   font-size="11">low</text>

  <rect x="50" y="102" width="240" height="48" fill="#fff3da" stroke="#c08020"/>
  <text x="170" y="125" text-anchor="middle">System segment (SYSSEG=0)</text>
  <text x="170" y="143" text-anchor="middle" font-size="11">vectors INT 20H..28H, KYDBUF=047DH</text>
  <text x="295" y="115" font-size="11">00400H</text>

  <rect x="50" y="150" width="240" height="190" fill="#e7f5ec" stroke="#3a8b53"/>
  <text x="170" y="175" text-anchor="middle" font-weight="700">User segment (USRSEG=0080H)</text>
  <text x="170" y="195" text-anchor="middle" font-size="11">CS=DS=SS=0080H → physical 00800H</text>
  <line x1="60" y1="210" x2="280" y2="210" stroke="#3a8b53" stroke-dasharray="3 2"/>
  <text x="170" y="228" text-anchor="middle" font-size="11">code at ORG 0100H (phys 00900H)</text>
  <text x="170" y="248" text-anchor="middle" font-size="11">data, labels, DB/DW directives</text>
  <line x1="60" y1="270" x2="280" y2="270" stroke="#3a8b53" stroke-dasharray="3 2"/>
  <text x="170" y="290" text-anchor="middle" font-size="11">stack grows down from SP=FFF0H</text>
  <text x="170" y="310" text-anchor="middle" font-size="11">→ physical 017FE0H</text>
  <text x="295" y="160" font-size="11">00800H</text>
  <text x="295" y="338" font-size="11">017FFFH</text>

  <rect x="50" y="340" width="240" height="100" fill="#f3f3f3" stroke="#888"/>
  <text x="170" y="365" text-anchor="middle" font-style="italic" fill="#555">unused / future ROM</text>
  <text x="295" y="350" font-size="11">018000H</text>

  <rect x="50" y="440" width="240" height="32" fill="#dde9fb" stroke="#3b6abf"/>
  <text x="170" y="461" text-anchor="middle">Monitor ROM (FXXXX block)</text>
  <text x="295" y="461" font-size="11">F0000H</text>
  <text x="45"  y="461" text-anchor="end" font-size="11">high</text>

  <!-- I/O port column -->
  <text x="520" y="58" text-anchor="middle" font-weight="700" font-size="14">MUART 8256 (256 ports)</text>

  <!-- IO port table -->
  <g transform="translate(380,72)">
    <rect width="300" height="32" fill="#fff" stroke="#999"/>
    <text x="6" y="20" font-family="monospace">0x40</text>
    <text x="68" y="20">PIC command (EOI=20)</text>
    <text x="222" y="20" font-size="11" font-style="italic">W</text>

    <rect y="32" width="300" height="32" fill="#fff" stroke="#999"/>
    <text x="6" y="52" font-family="monospace">0x42</text>
    <text x="68" y="52">PIC mask</text>
    <text x="222" y="52" font-size="11" font-style="italic">W</text>

    <rect y="64" width="300" height="32" fill="#dfe9fa" stroke="#3b6abf"/>
    <text x="6" y="84" font-family="monospace">0x80</text>
    <text x="68" y="84">UCRREG1 — clock/control 1</text>
    <text x="222" y="84" font-size="11" font-style="italic">W</text>

    <rect y="96" width="300" height="32" fill="#dfe9fa" stroke="#3b6abf"/>
    <text x="6" y="116" font-family="monospace">0x82</text>
    <text x="68" y="116">UCRREG2 — serial mode</text>
    <text x="222" y="116" font-size="11" font-style="italic">W</text>

    <rect y="128" width="300" height="32" fill="#dfe9fa" stroke="#3b6abf"/>
    <text x="6" y="148" font-family="monospace">0x84</text>
    <text x="68" y="148">UCRREG3 — stop bits / parity</text>
    <text x="222" y="148" font-size="11" font-style="italic">W</text>

    <rect y="160" width="300" height="32" fill="#e7f5ec" stroke="#3a8b53"/>
    <text x="6" y="180" font-family="monospace">0x86</text>
    <text x="68" y="180">UMODEREG — 0=ADC, 3=DAC</text>
    <text x="222" y="180" font-size="11" font-style="italic">R/W</text>

    <rect y="192" width="300" height="32" fill="#e7f5ec" stroke="#3a8b53"/>
    <text x="6" y="212" font-family="monospace">0x88</text>
    <text x="68" y="212">UPORT1CTL — per-bit dir</text>
    <text x="222" y="212" font-size="11" font-style="italic">R/W</text>

    <rect y="224" width="300" height="32" fill="#fde9e6" stroke="#c04040"/>
    <text x="6" y="244" font-family="monospace">0x8A</text>
    <text x="68" y="244">UIRQEN — IRQ enable</text>
    <text x="222" y="244" font-size="11" font-style="italic">W</text>

    <rect y="256" width="300" height="32" fill="#fde9e6" stroke="#c04040"/>
    <text x="6" y="276" font-family="monospace">0x8C</text>
    <text x="68" y="276">UIRQADR — IRQ ack (clears)</text>
    <text x="222" y="276" font-size="11" font-style="italic">R</text>

    <rect y="288" width="300" height="32" fill="#fff3da" stroke="#c08020"/>
    <text x="6" y="308" font-family="monospace">0x90</text>
    <text x="68" y="308">UPORT1 — 8-bit GPIO</text>
    <text x="222" y="308" font-size="11" font-style="italic">R/W</text>

    <rect y="320" width="300" height="32" fill="#fff3da" stroke="#c08020"/>
    <text x="6" y="340" font-family="monospace">0x92</text>
    <text x="68" y="340">UPORT2 — DAC/ADC data</text>
    <text x="222" y="340" font-size="11" font-style="italic">R/W</text>

    <rect y="352" width="300" height="32" fill="#fde9e6" stroke="#c04040"/>
    <text x="6" y="372" font-family="monospace">0x94</text>
    <text x="68" y="372">UTIMER1 — countdown reload</text>
    <text x="222" y="372" font-size="11" font-style="italic">W</text>

    <rect y="384" width="300" height="32" fill="#f3f3f3" stroke="#888"/>
    <text x="6" y="404" font-family="monospace">0x96..0x9C</text>
    <text x="120" y="404">UTIMER2..5 (stubs)</text>

    <rect y="416" width="300" height="32" fill="#f3f3f3" stroke="#888"/>
    <text x="6" y="436" font-family="monospace">0x9E</text>
    <text x="68" y="436">USTATUS</text>
    <text x="222" y="436" font-size="11" font-style="italic">R</text>
  </g>

  <!-- Bottom legend -->
  <g transform="translate(40,500)">
    <rect width="14" height="14" fill="#dfe9fa" stroke="#3b6abf"/>
    <text x="20" y="12" font-size="11">Serial control</text>
    <rect width="14" height="14" x="120" fill="#e7f5ec" stroke="#3a8b53"/>
    <text x="140" y="12" font-size="11">Mode / direction</text>
    <rect width="14" height="14" x="260" fill="#fff3da" stroke="#c08020"/>
    <text x="280" y="12" font-size="11">GPIO / data</text>
    <rect width="14" height="14" x="380" fill="#fde9e6" stroke="#c04040"/>
    <text x="400" y="12" font-size="11">IRQ / timer</text>
    <rect width="14" height="14" x="500" fill="#f3f3f3" stroke="#888"/>
    <text x="520" y="12" font-size="11">stub</text>
  </g>
</svg>
